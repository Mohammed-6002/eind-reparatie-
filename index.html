<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Pagina</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo"><img src="img/Quiz-Logo.png" alt=""></div>
            <h1>Quizs</h1>
            <div class="theme-toggle">&#128065;</div>
        </header>
        <nav class="menu">
            <button>Nieuwe Spel</button>
            <button>High Scores</button>
            <button>Save</button>
            <button>Load</button>
        </nav>
        <main>
            <div class="quiz-container">
                <h2>Vraag?</h2>
                <div class="answers">
                    <button>Antw. 1</button>
                    <button>Antw. 2</button>
                    <button>Antw. 3</button>
                    <button>Antw. 4</button>
                </div>
            </div>
        </main>
        <footer>
            <div class="info">
                <a href="#">Regels</a>
                <a href="#">Over</a>
                <a href="#">Credits</a>
            </div>
            <div class="links">
                <h3>CS Links</h3>
                <a href="https://www.w3schools.com/">W3Schools</a>
                <a href="https://stackoverflow.com/">Stack Overflow</a>
            </div>
            <div class="news">
                <h3>Tech Nieuws</h3>
                <a href="https://technieuws.com/">TechNieuws</a>
            </div>
        </footer>
    </div>
</body>
</html>
